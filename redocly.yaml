reunite:
  agent:
    enabled: true

    mcpServers:
      Variable headers:
        type: http
        url: https://mcp.example.com/mcp
        description: Takes its headers from project variables.
        headers:
          Authorization: 'Bearer {{ process.env.MCP_TOKEN }}'
          X-Tenant: '{{ process.env.MCP_TENANT }}'

      Literal headers:
        type: http
        url: https://mcp.invalid.example.com/mcp
        description: Carries an invalid token written in the file.
        headers:
          Authorization: Bearer not-a-real-token
          X-Api-Key: also-not-real

      No headers:
        type: http
        url: https://mcp.example.org/mcp
        description: Sends no headers.