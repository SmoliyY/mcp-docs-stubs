reunite:
  agent:
    enabled: true

    mcpServers:
      Variable headers:
        type: http
        url: https://mcp.example.com/mcp
        description: Takes its headers from project variables.
        headers:
          Authorization: 'Bearer {{ process.env.MCP_TOKEN }}'
          X-Tenant: '{{ process.env.MCP_TENANT }}'
    supportDesks:
      'Front (real)':
        provider: front
        apiToken: '{{ process.env.FRONT_API_TOKEN2 }}'
        signingSecret: '{{ process.env.FRONT_API_SECRET2 }}'